[package]
name = "ysm-parser"
version = "0.3.5"
description = "YSMParser — .ysm model decryptor"
authors = []
license = "LGPL-3.0-or-later"
repository = "https://github.com/OpenYSM/YSMParser"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ysm_parser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ysm-parser"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
